<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>博物馆讲解服务每日统计</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="app">


<header>

<h1>
🏛 博物馆讲解服务每日统计
</h1>


<p id="today"></p>


</header>





<!-- 登录 -->

<section id="loginCard" class="card login-card">


<h2>
管理员入口
</h2>


<input
id="username"
placeholder="账号">


<input
id="password"
type="password"
placeholder="密码">


<button id="loginBtn">
登录
</button>


<p id="loginMessage"></p>


</section>






<!-- 主页面 -->

<section id="mainPage" style="display:none;">






<!-- 日期 -->

<div class="card">


<h2>
📅 记录日期
</h2>


<input
type="date"
id="recordDate">


<p>
可补录之前日期的工作记录
</p>


</div>







<!-- 提成规则 -->

<div class="card">

<h2>
⚙️ 提成规则
</h2>


<div id="commissionDisplay">

<p>
当前提成：<span id="currentCommission">1.8</span>元/张
</p>


<button id="editCommissionBtn">
修改提成
</button>

</div>


<div id="commissionEditForm" style="display:none;">

<label>
生效日期：
</label>

<input type="date" id="commissionEffectiveDate">


<label>
新的提成（元/张）：
</label>

<input type="number" id="newCommissionRate" step="0.1" min="0" placeholder="如 2.0">


<button id="saveCommissionBtn">
保存
</button>


<button id="cancelCommissionBtn" class="btn-cancel">
取消
</button>

</div>


</div>


<!-- 今日值班 -->

<div class="card">


<h2>
👥 今日值班
</h2>


<div id="guideCheckboxes">

</div>


</div>








<!-- 今日讲解 -->

<div class="card">


<h2>
🎤 今日讲解记录
</h2>



<div id="sessionList">

</div>



<button id="addSession">

➕ 添加讲解场次

</button>



</div>








<!-- 当日讲解汇总 -->

<div class="card">


<h2>
📋 当日讲解汇总
</h2>


<table class="summary-table">


<thead>

<tr>

<th>
时间
</th>


<th>
讲解员
</th>


<th>
人数
</th>


<th>
本场收入
</th>


</tr>

</thead>



<tbody id="dailySummaryBody">


<tr>

<td colspan="4">

暂无讲解记录

</td>

</tr>


</tbody>



<tfoot>

<tr>

<td colspan="2">

当天合计

</td>


<td id="summaryTotalPeople">

0人

</td>


<td id="summaryTotalIncome">

0元

</td>


</tr>


</tfoot>


</table>


</div>







<!-- 今日统计 -->


<div class="card">


<h2>
📊 今日统计
</h2>



<div class="result">


<p>

👥 接待人数：

<span id="todayPeople">
0
</span>

人


</p>




<p>

💰 总收入：

<span id="income">
0.00
</span>

元


</p>




<p>

💵 总提成：

<span id="commission">
0.00
</span>

元


</p>



</div>


</div>





<!-- 提成分配 -->


<div class="card">


<h2>
💰 提成分配
</h2>


<div id="summary">

</div>


</div>
<!-- 保存区域 -->

<div class="card">


<button id="saveBtn">

💾 保存今日记录

</button>



<button id="newBtn">

🆕 新建记录

</button>



<button id="logoutBtn">

退出登录

</button>


</div>









<!-- 历史记录 -->


<div class="card">


<h2>
📚 历史记录
</h2>


<button id="historyBtn">

查看历史记录

</button>


<div id="historyPanel">

</div>


</div>









<!-- 周/月统计 -->


<div class="card">


<h2>
📈 周/月统计
</h2>


<div id="statistics">

</div>


</div>





<div class="card">


<canvas id="weekChart"></canvas>


</div>





<div class="card">


<canvas id="monthChart"></canvas>


</div>









<!-- 日期汇总 -->


<div class="card">


<h2>
📅 日期汇总
</h2>



<label>

开始日期：

</label>


<input 
type="date"
id="summaryStartDate">



<br><br>




<label>

结束日期：

</label>


<input 
type="date"
id="summaryEndDate">



<br><br>




<button id="summaryBtn">

查询汇总

</button>



<div id="rangeSummary">

</div>



</div>




<!-- 李林亚彩蛋 -->


<div
id="giftBox"
style="display:none;"
class="gift-box">


<div class="tooth">

🦷

</div>


<p id="giftText">

</p>


</div>






</section>


</div>








<!-- 配置 -->

<script src="config.js"></script>



<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script src="supabase.js"></script>





<!-- 图表 -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>





<!-- 主程序 -->

<script src="app.js"></script>



</body>


</html>
