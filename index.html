<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>博物馆讲解服务每日统计</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="app">


<header>

<h1>🏛 博物馆讲解服务每日统计</h1>

<p id="today"></p>

</header>





<!-- 登录 -->

<section id="loginCard" class="card">


<h2>登录</h2>


<input
id="username"
placeholder="账号">


<input
id="password"
type="password"
placeholder="密码">


<button id="loginBtn">

登录

</button>


<p id="loginMessage"></p>


</section>







<!-- 主页面 -->

<section id="mainPage" style="display:none;">







<!-- 值班 -->

<div class="card">


<h2>👥 今日值班</h2>


<div id="guideCheckboxes"></div>


</div>







<!-- 日期选择 -->

<div class="card">


<h2>📅 记录日期</h2>


<input
type="date"
id="recordDate">


<p style="font-size:14px;color:#777;">

可用于补录之前日期的工作记录

</p>


</div>







<!-- 讲解记录 -->

<div class="card">


<h2>🎤 今日讲解记录</h2>



<div id="sessionList"></div>



<button id="addSession">

➕ 添加讲解场次

</button>



</div>








<!-- 自动计算 -->

<div class="card">


<h2>🎫 今日统计</h2>


<div class="result">


<p>

👥 接待人数：

<span id="todayPeople">

0

</span>

人

</p>



<p>

💰 收入：

<span id="income">

0.00

</span>

元

</p>



<p>

💵 提成：

<span id="commission">

0.00

</span>

元

</p>


</div>


</div>









<!-- 保存 -->

<div class="card">


<button id="saveBtn">

💾 保存今日记录

</button>


</div>








<!-- 自动统计 -->

<div class="card">


<h2>
📊 数据统计
</h2>


<div id="summary"></div>



<div id="statistics"></div>



</div>








<!-- 数据核对 -->

<div class="card">


<h2>

✅ 数据核对

</h2>


<p id="checkResult">

等待录入……

</p>


</div>








<!-- 历史 -->

<div class="card">


<button id="historyBtn">

📚 历史记录

</button>


<button id="newBtn">

🆕 新建今日统计

</button>


<button id="logoutBtn">

退出登录

</button>



<div id="historyPanel"></div>


</div>








<!-- 李林亚彩蛋 -->


<div id="giftBox"
style="
display:none;
position:fixed;
top:30%;
left:50%;
transform:translateX(-50%);
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
text-align:center;
z-index:999;
">


<div style="font-size:70px;">

🦷

</div>


<h3 id="giftText"></h3>


</div>








</section>



</div>





<script src="config.js"></script>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase.js"></script>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script src="app.js"></script>



</body>


</html>
